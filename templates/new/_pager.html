{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Sahifalar">
    {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}"><i class="fa-solid fa-chevron-left"></i> Oldingi</a>{% endif %}
    <span class="muted">{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}">Keyingi <i class="fa-solid fa-chevron-right"></i></a>{% endif %}
</nav>
{% endif %}
