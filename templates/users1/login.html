{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | Ilm Najot ERP</title>
    <script src="{% static 'js/theme-init.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        .login-card { width: 100%; max-width: 400px; }
        .login-brand { display: flex; align-items: center; gap: .75rem; justify-content: center; margin-bottom: 1.25rem; font-weight: 700; font-size: 1.25rem; }
        .login-brand img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .login-card h1 { font-size: 1.15rem; font-weight: 600; text-align: center; margin-bottom: 1.25rem; color: var(--text-muted); }
        .login-card .btn { width: 100%; margin-top: .5rem; }
        .login-theme { position: fixed; top: 1rem; right: 1rem; }
    </style>
</head>
<body>
    <button class="theme-toggle login-theme" id="themeToggle" type="button" aria-label="Rejimni almashtirish"><i class="fas fa-moon" aria-hidden="true"></i></button>
    <main class="login-wrap">
        <div class="card login-card">
            <div class="login-brand">
                <img src="{% static 'images/logo.png' %}" alt="">
                <span>Ilm Najot ERP</span>
            </div>
            <h1>Tizimga kirish</h1>

            {% if messages %}
            <div role="alert">
                {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}error{% else %}info{% endif %}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% if form.non_field_errors %}
            <div class="alert alert-error" role="alert">{{ form.non_field_errors.0 }}</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}" class="required">Foydalanuvchi nomi</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required
                           value="{{ form.username.value|default:'' }}">
                </div>
                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}" class="required">Parol</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Kirish</button>
            </form>
        </div>
    </main>
    <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
