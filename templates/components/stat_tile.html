<a href="{{ href }}" class="stat-tile stat-{{ tone|default:'primary' }}">
    <span class="stat-icon"><i class="fas fa-{{ icon }}" aria-hidden="true"></i></span>
    <span class="stat-body">
        <span class="stat-value">{{ value }}</span>
        <span class="stat-label">{{ label }}</span>
    </span>
</a>
