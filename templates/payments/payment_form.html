{% extends 'base.html' %}

{% block title %}Yangi To'lov | Ilm Najot ERP{% endblock %}
{% block header_title %}To'lovni Qabul Qilish{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
    <div class="glass-panel">
        <div id="errorBox" style="display:none; background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;"></div>

        <!-- STEP 1: O'quvchi tanlash -->
        <div id="step1">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <!-- Chap tomon: Qidiruv -->
                <div>
                    <h3 style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.95rem;">
                        <i class="fas fa-search" style="margin-right: 0.5rem;"></i> Qidiruv
                    </h3>
                    <div class="form-group" style="position: relative;">
                        <input type="text" id="searchInput" placeholder="Ism yoki telefon..."
                               oninput="onSearch()" autocomplete="off" style="padding-left: 3rem;">
                        <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    </div>
                    <div id="searchResults" style="max-height: 350px; overflow-y: auto;"></div>
                </div>

                <!-- O'ng tomon: Guruh tanlash -->
                <div>
                    <h3 style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.95rem;">
                        <i class="fas fa-users" style="margin-right: 0.5rem;"></i> Guruh bo'yicha
                    </h3>
                    <div class="form-group">
                        <select id="groupSelect" onchange="onGroupChange()">
                            <option value="">-- Guruh tanlang --</option>
                            {% for group in groups %}
                            <option value="{{ group.id }}" data-name="{{ group.name }}" data-fee="{{ group.monthly_fee }}">
                                {{ group.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div id="groupStudentList" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <!-- STEP 2: To'lov -->
        <div id="step2" style="display: none;">
            <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: 600;" id="paymentStudentName"></div>
                    <div style="color: var(--text-muted); font-size: 0.85rem;" id="paymentGroupName"></div>
                </div>
                <button type="button" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;" onclick="resetAll()">
                    <i class="fas fa-times"></i> Boshidan
                </button>
            </div>

            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; text-align: center;">
                <div style="color: var(--text-muted); font-size: 0.85rem;">Jami qarz</div>
                <div style="font-size: 1.75rem; font-weight: 700; color: var(--danger);" id="totalDebt">0 so'm</div>
            </div>

            <div id="paymentTypeButtons" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem;">
                <button type="button" class="btn btn-primary" onclick="selectPaymentType('full')" id="btnFull">
                    <i class="fas fa-check-double"></i> To'liq
                </button>
                <button type="button" class="btn btn-outline" onclick="selectPaymentType('partial')" id="btnPartial">
                    <i class="fas fa-edit"></i> Qisman
                </button>
                <button type="button" class="btn btn-outline" onclick="selectPaymentType('extra')" id="btnExtra">
                    <i class="fas fa-plus-circle"></i> Ko'proq
                </button>
            </div>

            <div id="amountInput" style="display: none;" class="form-group">
                <label for="id_amount">Summa (so'm)</label>
                <input type="number" id="id_amount" step="1" min="1" placeholder="0">
            </div>

            <div class="form-group">
                <label>To'lov sanasi</label>
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                    <button type="button" class="btn btn-primary" id="btnToday" onclick="setDate('today')" style="flex: 1;">
                        <i class="fas fa-calendar-day"></i> Bugun
                    </button>
                    <button type="button" class="btn btn-outline" id="btnOtherDate" onclick="setDate('other')" style="flex: 1;">
                        <i class="fas fa-calendar-alt"></i> Boshqa kun
                    </button>
                </div>
                <input type="date" id="id_payment_date" style="display: none; margin-top: 0.75rem;" value="{{ today }}">
                <div id="dateHint" style="display: none; color: var(--text-muted); font-size: 0.75rem; margin-top: 0.3rem;">Format: kun/oy/yil</div>
            </div>

            <div class="form-group">
                <label for="id_method">To'lov usuli</label>
                <select id="id_method">
                    <option value="CASH">Naqd</option>
                    <option value="CARD">Karta</option>
                    <option value="TRANSFER">O'tkazma</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <button type="button" class="btn btn-outline" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    <span>Orqaga</span>
                </button>
                <button type="button" class="btn btn-primary" id="submitBtn" onclick="submitPayment()">
                    <i class="fas fa-check-circle"></i>
                    <span>To'lovni Saqlash</span>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .student-item {
        padding: 0.8rem 1rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.2s;
        border-radius: 10px;
        margin-bottom: 0.3rem;
    }
    .student-item:hover {
        background: rgba(99, 102, 241, 0.1);
    }
</style>

<script>
let selectedGroup = null;
let selectedStudent = null;
let selectedPaymentType = null;
let totalDebt = 0;
let searchTimeout = null;
let groupStudentsData = [];

function formatMoney(value) {
    return Number(value).toLocaleString('uz-UZ');
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
}

function hideError() {
    document.getElementById('errorBox').style.display = 'none';
}

function onSearch() {
    hideError();
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    clearTimeout(searchTimeout);

    if (query.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
    }

    searchTimeout = setTimeout(() => {
        fetch(`{% url 'payments:api_search_students' %}?q=${encodeURIComponent(query)}`)
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('searchResults');
                if (data.students.length === 0) {
                    container.innerHTML = '<div style="padding: 1rem; color: var(--text-muted); text-align: center;">Topilmadi</div>';
                } else {
                    container.innerHTML = data.students.map(s => `
                        <div class="student-item" onclick="selectFromSearch(${JSON.stringify(s).replace(/"/g, '&quot;')})">
                            <div style="font-weight: 600;">${s.full_name}</div>
                            <div style="color: var(--text-muted); font-size: 0.8rem;">${s.phone || ''} — ${s.groups.map(g => g.name).join(', ') || 'Guruh yo\'q'}</div>
                        </div>
                    `).join('');
                }
            })
            .catch(() => showError('Qidirishda xatolik'));
    }, 300);
}

function selectFromSearch(student) {
    if (student.groups.length === 0) {
        showError('Bu o\'quvchi hech qanday guruhga biriktirilmagan.');
        return;
    }
    if (student.groups.length === 1) {
        selectedStudent = { id: student.id, full_name: student.full_name };
        selectedGroup = { id: student.groups[0].id, name: student.groups[0].name, fee: student.groups[0].monthly_fee };
        loadDebt();
    } else {
        selectedStudent = { id: student.id, full_name: student.full_name };
        const container = document.getElementById('groupStudentList');
        container.innerHTML = '<div style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem;">Guruhni tanlang:</div>' +
            student.groups.map(g => `
                <div class="student-item" onclick="selectGroup(${JSON.stringify(g).replace(/"/g, '&quot;')})">
                    <div style="font-weight: 600;"><i class="fas fa-users" style="margin-right: 0.5rem;"></i>${g.name}</div>
                    <div style="color: var(--text-muted); font-size: 0.8rem;">Oylik: ${formatMoney(g.monthly_fee)} so'm</div>
                </div>
            `).join('');
        document.getElementById('groupSelect').value = '';
    }
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchInput').value = student.full_name;
}

function onGroupChange() {
    hideError();
    const select = document.getElementById('groupSelect');
    const groupId = select.value;
    const container = document.getElementById('groupStudentList');

    if (!groupId) {
        container.innerHTML = '';
        groupStudentsData = [];
        return;
    }

    const opt = select.options[select.selectedIndex];
    selectedGroup = { id: groupId, name: opt.dataset.name, fee: opt.dataset.fee };

    fetch(`/groups/api/${groupId}/students/`)
        .then(r => r.json())
        .then(data => {
            groupStudentsData = data.students;
            if (data.students.length === 0) {
                container.innerHTML = '<div style="padding: 1rem; color: var(--text-muted); text-align: center;">Guruhda o\'quvchilar yo\'q</div>';
            } else {
                container.innerHTML = data.students.map(s => `
                    <div class="student-item" onclick="selectFromGroup(${s.id}, '${s.last_name} ${s.first_name}')">
                        <div style="font-weight: 600;">${s.last_name} ${s.first_name}</div>
                    </div>
                `).join('');
            }
        })
        .catch(() => showError('Xatolik'));
}

function selectFromGroup(studentId, fullName) {
    selectedStudent = { id: studentId, full_name: fullName };
    loadDebt();
}

function selectGroup(group) {
    selectedGroup = group;
    loadDebt();
}

function loadDebt() {
    document.getElementById('step1').style.display = 'none';

    fetch(`/payments/api/student-balance/${selectedStudent.id}/${selectedGroup.id}/?months=12`)
        .then(r => r.json())
        .then(data => {
            totalDebt = 0;
            data.balances.forEach(b => {
                totalDebt += parseFloat(b.debt_amount);
            });

            document.getElementById('paymentStudentName').textContent = selectedStudent.full_name;
            document.getElementById('paymentGroupName').textContent = selectedGroup.name + ' — Oylik: ' + formatMoney(selectedGroup.fee) + ' so\'m';
            document.getElementById('totalDebt').textContent = formatMoney(totalDebt) + ' so\'m';

            selectedPaymentType = null;
            document.getElementById('paymentTypeButtons').querySelectorAll('.btn').forEach(b => {
                b.className = 'btn btn-outline';
            });
            document.getElementById('amountInput').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        })
        .catch(() => showError('Qarz ma\'lumotini yuklashda xatolik.'));
}

function selectPaymentType(type) {
    hideError();
    selectedPaymentType = type;
    const amountInput = document.getElementById('amountInput');
    const amountField = document.getElementById('id_amount');
    const btns = document.getElementById('paymentTypeButtons').querySelectorAll('.btn');

    btns.forEach(b => b.className = 'btn btn-outline');

    if (type === 'full') {
        btns[0].className = 'btn btn-primary';
        amountInput.style.display = 'none';
        amountField.value = totalDebt;
    } else if (type === 'partial') {
        btns[1].className = 'btn btn-primary';
        amountInput.style.display = 'block';
        amountField.value = '';
        amountField.placeholder = `0 dan ${formatMoney(totalDebt)} gacha`;
    } else if (type === 'extra') {
        btns[2].className = 'btn btn-primary';
        amountInput.style.display = 'block';
        amountField.value = '';
        amountField.placeholder = `${formatMoney(totalDebt)} dan ortiq`;
    }
}

function setDate(type) {
    const dateInput = document.getElementById('id_payment_date');
    const dateHint = document.getElementById('dateHint');
    const btnToday = document.getElementById('btnToday');
    const btnOther = document.getElementById('btnOtherDate');

    if (type === 'today') {
        dateInput.value = '{{ today }}';
        dateInput.style.display = 'none';
        dateHint.style.display = 'none';
        btnToday.className = 'btn btn-primary';
        btnOther.className = 'btn btn-outline';
    } else {
        dateInput.style.display = 'block';
        dateHint.style.display = 'block';
        btnToday.className = 'btn btn-outline';
        btnOther.className = 'btn btn-primary';
    }
}

function resetAll() {
    selectedGroup = null;
    selectedStudent = null;
    totalDebt = 0;
    selectedPaymentType = null;
    document.getElementById('groupSelect').value = '';
    document.getElementById('groupStudentList').innerHTML = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('amountInput').style.display = 'none';
    hideError();
}

function goBack() {
    hideError();
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
}

function submitPayment() {
    hideError();
    const amount = document.getElementById('id_amount').value;
    const paymentDate = document.getElementById('id_payment_date').value;
    const method = document.getElementById('id_method').value;

    if (!selectedStudent || !selectedGroup) { showError('O\'quvchi va guruhni tanlang.'); return; }

    let finalAmount;
    if (selectedPaymentType === 'full') {
        finalAmount = totalDebt;
    } else {
        finalAmount = parseFloat(amount);
        if (!finalAmount || finalAmount <= 0) { showError('Summani kiriting.'); return; }
    }

    if (!paymentDate) { showError('Sanani kiriting.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Saqlanmoqda...</span>';

    fetch("{% url 'payments:api_create_payment' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}',
        },
        body: JSON.stringify({
            student_id: selectedStudent.id,
            group_id: selectedGroup.id,
            amount: finalAmount,
            payment_date: paymentDate,
            method: method,
            note: '',
        }),
    })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
        if (!ok) {
            showError(data.detail || 'Xatolik yuz berdi.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>To\'lovni Saqlash</span>';
            return;
        }
        window.location.href = "{% url 'payments:payment_list' %}";
    })
    .catch(() => {
        showError('Tarmoq xatoligi.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>To\'lovni Saqlash</span>';
    });
}
</script>
{% endblock %}
